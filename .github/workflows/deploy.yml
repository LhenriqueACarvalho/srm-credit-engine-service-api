name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Docker image
        run: |
          docker build -t srm-credit-engine:${{ github.event.release.tag_name }} .

      - name: Push to Docker Hub
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker push srm-credit-engine:${{ github.event.release.tag_name }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/srm-credit-engine \
            srm-credit-engine=srm-credit-engine:${{ github.event.release.tag_name }} \
            --record