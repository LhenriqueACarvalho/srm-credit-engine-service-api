# Spring Boot Test Configuration
spring.application.name=SRM-Credit-Engine-Test

# Database Configuration - H2 In-Memory
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_MODE=0
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# H2 Settings
spring.h2.console.enabled=false

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# Flyway Configuration - Disabled for tests (using create-drop DDL instead)
spring.flyway.enabled=false

# Cache - Use simple in-memory cache for tests
spring.cache.type=simple

# Redis - Completely disabled for tests
spring.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=0

# Logging
logging.level.root=WARN
logging.level.com.srm.credit.engine=DEBUG
logging.level.org.springframework.boot.autoconfigure=WARN
logging.level.org.springframework.boot.test=INFO
logging.level.org.flyway=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG

# Actuator - Disabled for tests
management.endpoints.web.exposure.include=

# Servlet
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
