spring.application.name=SRM-Credit-Engine


# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_engine
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# Server
server.port=8081
server.servlet.context-path=/api

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.root=INFO
logging.level.com.srm.credit.engine=DEBUG
logging.level.com.srm.credit.engine.SRM_Credit_Engine.controller=DEBUG
logging.level.com.srm.credit.engine.SRM_Credit_Engine.service=DEBUG
logging.level.com.srm.credit.engine.SRM_Credit_Engine.utils=DEBUG
logging.level.com.srm.credit.engine.SRM_Credit_Engine.config=DEBUG
logging.level.com.srm.credit.engine.SRM_Credit_Engine.exception=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.pattern.console=%d{dd/MM/yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{dd/MM/yyyy HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.max-history=30
logging.max-size=100MB

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.tags.application=SRM-Credit-Engine
management.metrics.tags.environment=production

# Sleuth
spring.sleuth.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
spring.sleuth.sampler.probability=1.0
logging.pattern.level=%5p [${spring.application.name},%X{traceId},%X{spanId}]

# Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=2000
spring.redis.connect-timeout=2000
spring.cache.type=simple

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true